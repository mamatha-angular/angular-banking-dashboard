<form class="login-container" (submit)="onSubmit($event)">
  <mat-card class="login-card" appearance="outlined">
    <mat-card-header>
      <mat-card-title class="login-card-title">USER LOGIN</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <mat-form-field class="login-card-field" appearance="outline">
        <input
          matInput
          class="login-card-input"
          placeholder="User Name"
          type="email"
          [formField]="loginForm.email"
        />
        <mat-icon class="login-card-icon" matPrefix>account_circle</mat-icon>
      </mat-form-field>
      <mat-form-field class="login-card-field" appearance="outline">
        <input
          matInput
          class="login-card-input"
          placeholder="Password"
          type="password"
          [formField]="loginForm.password"
        />
        <mat-icon class="login-card-icon" matSuffix>lock_outline</mat-icon>
      </mat-form-field>
    </mat-card-content>
    <mat-card-actions>
      <button type="submit" class="login-card-logbtn" matButton="elevated">
        LogIn
      </button>
      <!-- <button type="submit" class="login-card-logbtn" matButton="elevated">Register</button> -->
    </mat-card-actions>
  </mat-card>
</form>
